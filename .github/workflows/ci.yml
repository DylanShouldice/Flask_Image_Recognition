name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Pylint and pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and check dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run Pylint
        id: pylint
        run: python -m pylint app.py model.py

      - name: Run pytest
        id: pytest
        # Still run the full test suite when Pylint fails.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest -v

      - name: Report workflow result
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          PYLINT_RESULT: ${{ steps.pylint.outcome }}
          PYTEST_RESULT: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "## CI result: $RESULT"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Dependency installation | $DEPENDENCIES_RESULT |"
            echo "| Pylint | $PYLINT_RESULT |"
            echo "| pytest | $PYTEST_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
